name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,rpm'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm

      - name: Install frontend dependencies
        run: npm install

      - name: Generate per-format .icns files (macOS only)
        if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: |
          # Map of output-icns-name -> source SVG in icons/linux/
          declare -A ICON_MAP=(
            ["zip"]="matterpackr-zip"
            ["7z"]="matterpackr-7z"
            ["tar"]="matterpackr-tar"
            ["gz"]="matterpackr-gz"
            ["rar"]="matterpackr-rar"
            ["disk"]="matterpackr-iso"
          )
          for NAME in "${!ICON_MAP[@]}"; do
            SVG="icons/linux/${ICON_MAP[$NAME]}.svg"
            ICONSET="icons/${NAME}.iconset"
            ICNS="icons/${NAME}.icns"
            mkdir -p "$ICONSET"
            for SIZE in 16 32 64 128 256 512 1024; do
              sips -z $SIZE $SIZE "$SVG" --out "${ICONSET}/icon_${SIZE}x${SIZE}.png" --setProperty format png > /dev/null 2>&1 || true
            done
            # Add @2x variants
            for SIZE in 16 32 64 128 256 512; do
              DOUBLE=$((SIZE * 2))
              cp "${ICONSET}/icon_${DOUBLE}x${DOUBLE}.png" "${ICONSET}/icon_${SIZE}x${SIZE}@2x.png" 2>/dev/null || true
            done
            iconutil -c icns "$ICONSET" -o "$ICNS"
            rm -rf "$ICONSET"
            echo "Generated $ICNS"
          done

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MatterPackr ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
