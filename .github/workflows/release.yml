name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact-name: MatterPackr-v3.0.0-linux-x86_64.tar.gz
          - os: macos-latest
            artifact-name: MatterPackr-v3.0.0-macos-universal.zip
          - os: windows-latest
            artifact-name: MatterPackr-v3.0.0-windows-x64-Setup.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 (jurplel/install-qt-action)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.2'
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || '' }}

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libxkbcommon-dev libx11-xcb1 libglu1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -B native-qt/build -S native-qt -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build MatterPackr
        run: |
          cmake --build native-qt/build --config Release --parallel

      # Package Windows (.exe Setup Installer via NSIS)
      - name: Package Windows Installer (.exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/windows/dist
          Copy-Item native-qt/build/MatterPackr.exe packaging/windows/dist/
          windeployqt --release --no-translations --compiler-runtime packaging/windows/dist/MatterPackr.exe
          cd packaging/windows
          makensis /DPRODUCT_VERSION=3.0.0 "/DOUTFILE=$PWD/../../${{ matrix.artifact-name }}" installer.nsi
          cd ../..

      # Package macOS
      - name: Package macOS App Bundle
        if: matrix.os == 'macos-latest'
        run: |
          macdeployqt native-qt/build/MatterPackr.app -always-overwrite
          ditto -c -k --keepParent native-qt/build/MatterPackr.app ${{ matrix.artifact-name }}

      # Package Linux
      - name: Package Linux Binary
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p dist/MatterPackr
          cp native-qt/build/MatterPackr dist/MatterPackr/
          tar -czvf ${{ matrix.artifact-name }} -C dist MatterPackr

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact-name }}
          generate_release_notes: true
          draft: false
          prerelease: false
