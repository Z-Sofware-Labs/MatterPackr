name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact-name: MatterPackr-v3.0.3-linux-x86_64.tar.gz
          - os: macos-latest
            artifact-name: MatterPackr-v3.0.3-macos-universal.zip
          - os: windows-latest
            artifact-name: MatterPackr-v3.0.3-windows-x64-Setup.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 (jurplel/install-qt-action)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.2'
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || '' }}

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Setup MSVC & NSIS (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup MSVC Environment (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libxkbcommon-dev libx11-xcb1 libglu1-mesa-dev

      - name: Setup macOS OpenGL / AGL Compatibility
        if: matrix.os == 'macos-latest'
        run: |
          # Xcode 15+ removed AGL.framework from SDK. Compile a valid stub Mach-O dylib for AGL
          mkdir -p native-qt/build/Frameworks/AGL.framework
          echo "void stub_agl(void) {}" | clang -x c - -shared -arch arm64 -install_name "@rpath/AGL.framework/AGL" -o native-qt/build/Frameworks/AGL.framework/AGL

      - name: Configure CMake
        run: |
          cmake -B native-qt/build -S native-qt -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_FRAMEWORK_PATH="$PWD/native-qt/build/Frameworks"

      - name: Build MatterPackr
        run: |
          cmake --build native-qt/build --config Release --parallel

      # Package Windows (.exe Setup Installer via NSIS)
      - name: Package Windows Installer (.exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/windows/dist
          Copy-Item native-qt/build/MatterPackr.exe packaging/windows/dist/
          windeployqt --release --no-translations --compiler-runtime packaging/windows/dist/MatterPackr.exe
          cd packaging/windows
          makensis /DPRODUCT_VERSION=3.0.3 "/DOUTFILE=$PWD/../../${{ matrix.artifact-name }}" installer.nsi
          cd ../..

      # Package macOS
      - name: Package macOS App Bundle
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p native-qt/build/MatterPackr.app/Contents/Resources
          # Copy pre-generated ICNS filetype and app icons
          cp native-qt/resources/macos/*.icns native-qt/build/MatterPackr.app/Contents/Resources/
          plutil -replace CFBundleIconFile -string "MatterPackr.icns" native-qt/build/MatterPackr.app/Contents/Info.plist
          macdeployqt native-qt/build/MatterPackr.app -always-overwrite
          ditto -c -k --keepParent native-qt/build/MatterPackr.app ${{ matrix.artifact-name }}


      # Package Linux
      - name: Package Linux Binary
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p dist/MatterPackr/share/applications dist/MatterPackr/share/icons/hicolor/256x256/apps dist/MatterPackr/share/icons/hicolor/256x256/mimetypes dist/MatterPackr/bin
          cp native-qt/build/MatterPackr dist/MatterPackr/bin/
          cp native-qt/resources/app.png dist/MatterPackr/share/icons/hicolor/256x256/apps/matterpackr.png
          cp packaging/linux/matterpackr.desktop dist/MatterPackr/share/applications/
          cp packaging/linux/icons/hicolor/256x256/mimetypes/*.png dist/MatterPackr/share/icons/hicolor/256x256/mimetypes/
          # Keep binary in root of dist/MatterPackr for direct portable execution
          cp native-qt/build/MatterPackr dist/MatterPackr/
          cp native-qt/resources/app.png dist/MatterPackr/matterpackr.png
          cp packaging/linux/install.sh dist/MatterPackr/
          cp packaging/linux/uninstall.sh dist/MatterPackr/
          chmod +x dist/MatterPackr/install.sh dist/MatterPackr/uninstall.sh
          tar -czvf ${{ matrix.artifact-name }} -C dist MatterPackr


      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact-name }}
          generate_release_notes: true
          draft: false
          prerelease: false

  sign-and-publish-updater:
    name: Sign & Publish Updater Manifest for Legacy Versions
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Setup Installer
        uses: actions/download-artifact@v4
        with:
          name: MatterPackr-v3.0.3-windows-x64-Setup.exe
          path: artifacts

      - name: Download Linux Archive
        uses: actions/download-artifact@v4
        with:
          name: MatterPackr-v3.0.3-linux-x86_64.tar.gz
          path: artifacts

      - name: Download macOS Archive
        uses: actions/download-artifact@v4
        with:
          name: MatterPackr-v3.0.3-macos-universal.zip
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Sign Releases & Generate latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p release-assets
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            WIN_FILE="artifacts/MatterPackr-v3.0.3-windows-x64-Setup.exe"
            npx @tauri-apps/cli signer sign --app-version 3.0.3 "$WIN_FILE"
            WIN_SIG=$(cat "${WIN_FILE}.sig")
            cp "$WIN_FILE" "artifacts/MatterPackr_3.0.3_x64-setup.exe"
            cp "${WIN_FILE}.sig" "artifacts/MatterPackr_3.0.3_x64-setup.exe.sig"

            LINUX_FILE="artifacts/MatterPackr-v3.0.3-linux-x86_64.tar.gz"
            npx @tauri-apps/cli signer sign --app-version 3.0.3 "$LINUX_FILE"
            LINUX_SIG=$(cat "${LINUX_FILE}.sig")
            cp "$LINUX_FILE" "artifacts/MatterPackr_3.0.3_amd64.tar.gz"
            cp "${LINUX_FILE}.sig" "artifacts/MatterPackr_3.0.3_amd64.tar.gz.sig"

            MAC_FILE="artifacts/MatterPackr-v3.0.3-macos-universal.zip"
            MAC_SIG=""
            if [ -f "$MAC_FILE" ]; then
              npx @tauri-apps/cli signer sign --app-version 3.0.3 "$MAC_FILE"
              MAC_SIG=$(cat "${MAC_FILE}.sig")
            fi

            PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            python3 packaging/generate_manifest.py "3.0.3" "$PUB_DATE" "$WIN_SIG" "$LINUX_SIG" "$MAC_SIG"

            cp artifacts/*.sig release-assets/
            cp artifacts/MatterPackr_3.0.3_*.exe release-assets/ 2>/dev/null || true
            cp artifacts/MatterPackr_3.0.3_*.tar.gz release-assets/ 2>/dev/null || true
            cp latest.json release-assets/
          fi

      - name: Upload Signatures and latest.json to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          fail_on_unmatched_files: false
