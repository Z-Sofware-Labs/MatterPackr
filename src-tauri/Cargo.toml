[package]
name = "matterpackr"
version = "1.0.9"
edition = "2021"
authors = ["Z Software Labs"]

[[bin]]
name = "matterpackr"
path = "src/main.rs"

[lib]
name = "matterpackr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2.5.0"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto"] }
walkdir = "2.5.0"
thiserror = "2"
tar = "0.4.46"
flate2 = "1.1.9"
bzip2 = "0.6.1"
sevenz-rust2 = { version = "0.21.3", features = ["compress", "util"] }
unrar = "0.5.8"
tauri-plugin-drag = "2.1.1"
hadris-optical = { version = "2.4.0", default-features = false, features = ["std", "read", "open", "iso", "udf", "sync"] }
hadris-io = { version = "2.4.0", features = ["std", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
resvg = "0.45.1"
image = "0.25.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

[profile.release.build-override]
codegen-units = 1
