<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <!-- Folder tab -->
  <path d="M5,18 Q5,14 9,14 L38,14 Q42,14 44,18 L44,22 L5,22 Z" fill="#a0520a"/>
  <!-- Folder body -->
  <rect x="5" y="20" width="90" height="55" rx="6" ry="6" fill="#f5a623"/>
  <!-- Shadow line under tab join -->
  <path d="M5,26 L95,26" stroke="#e09010" stroke-width="1.5" opacity="0.45"/>
  <!-- Zipper track (pill) -->
  <rect x="44" y="27" width="12" height="37" rx="6" fill="#253048"/>
  <!-- Zipper teeth -->
  <line x1="47" y1="32" x2="53" y2="32" stroke="#7a8faa" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="47" y1="37" x2="53" y2="37" stroke="#7a8faa" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="47" y1="42" x2="53" y2="42" stroke="#7a8faa" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="47" y1="47" x2="53" y2="47" stroke="#7a8faa" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="47" y1="52" x2="53" y2="52" stroke="#7a8faa" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Zipper pull ball -->
  <circle cx="50" cy="67" r="4.5" fill="#c8d0dc"/>
  <circle cx="50" cy="67" r="2.5" fill="#9aa5b4"/>
  <!-- Format badge -->
  <rect x="71" y="58" width="24" height="14" rx="3" fill="#b45309"/>
  <text x="83" y="68" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="auto">IMG</text>
</svg>